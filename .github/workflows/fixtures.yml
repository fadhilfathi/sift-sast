name: Fixtures

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which half of the corpus to regenerate"
        type: choice
        options: [all, semgrep, codeql]
        default: all

permissions:
  contents: read

jobs:
  generate:
    name: Regenerate SARIF corpus
    runs-on: ubuntu-24.04
    # CodeQL builds a database per target repo. Generous, but bounded.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Generate
        run: ./evals/fixtures/generate.sh "${{ inputs.scope }}"

      # The corpus is committed, so this artifact is what a human downloads and
      # commits after reviewing the diff. Generation never pushes on its own:
      # a scanner upgrade changing a fixture is a reviewable event, not an
      # automatic one.
      - name: Show what changed
        run: git --no-pager diff --stat -- evals/fixtures/ || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-fixtures
          path: |
            evals/fixtures/generated/
            evals/fixtures/MANIFEST.json
          if-no-files-found: error
