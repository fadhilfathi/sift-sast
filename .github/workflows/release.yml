name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --extra dev

      # A tag never ships without the same gate main is held to.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not llm"

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import sift; print(sift.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match sift.__version__ $pkg"
            exit 1
          fi

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - run: uv build
      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  # TODO(pypi): enable once a PyPI trusted publisher is configured for this repo.
  #   1. https://pypi.org/manage/account/publishing/ -> add a pending publisher
