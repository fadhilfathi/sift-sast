name: Wrong verdict
description: SIFT labeled a finding incorrectly
title: "[verdict]: "
labels: ["accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        **If SIFT dismissed a real vulnerability, this is the most important kind of
        issue we get.** A missed true positive is roughly 50x worse than a retained
        false positive.

        Do not paste proprietary source. A minimal reconstruction is better than a
        redacted real file.

  - type: dropdown
    id: direction
    attributes:
      label: What went wrong
      options:
        - Dismissed a real vulnerability (FALSE_POSITIVE, should be TRUE_POSITIVE)
        - Kept a genuine false positive (TRUE_POSITIVE, should be FALSE_POSITIVE)
        - Escalated something obvious (NEEDS_HUMAN_REVIEW, should be decidable)
    validations:
      required: true

  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: python.lang.security.audit.dangerous-subprocess-use
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: The justification SIFT gave
      description: Copy it from the annotated SARIF or the PR comment, verbatim.
      render: text
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code that reproduces it
      render: python
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why the correct label is what you say it is
      description: Point at the specific code. This becomes the rationale if we add it to the eval dataset.
    validations:
      required: true

  - type: checkboxes
    id: dataset
    attributes:
      label: Eval dataset
      options:
        - label: This case may be added to the public eval dataset
